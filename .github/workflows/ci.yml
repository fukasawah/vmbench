# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: build + verify (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Build
        run: cargo build --release
      - name: Self-containment audit
        run: tools/audit.sh
      - name: Registry consistency (docs/STATUS.md)
        run: python3 tools/status_check.py
      - name: Verification run (quick)
        run: |
          ./target/x86_64-unknown-linux-gnu/release/vmbench --quick --quiet --output /tmp/report.json
          python3 tools/print_status.py /tmp/report.json --require-ok
      - name: Mutation test (verification has teeth)
        run: tools/mutation_test.sh

  aarch64:
    name: build + verify (aarch64, qemu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Rust (stable) and target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          echo "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - name: Install qemu-user and aarch64 binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Self-containment audit
        env:
          QEMU: qemu-aarch64
        run: tools/audit.sh target/aarch64-unknown-linux-gnu/release/vmbench
      - name: Verification run under qemu
        run: |
          qemu-aarch64 target/aarch64-unknown-linux-gnu/release/vmbench --version
          qemu-aarch64 target/aarch64-unknown-linux-gnu/release/vmbench --quick --quiet \
            --only cpu.int,cpu.fp,cpu.isa,linux.syscall,cache.bandwidth.l1 \
            --output /tmp/arm.json
          python3 tools/print_status.py /tmp/arm.json --require-ok

  msrv:
    name: MSRV build (1.89.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build with MSRV
        run: cargo +1.89.0 build --release
