# This workflow is managed by gh actions-lock.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 aarch64-unknown-linux-gnu
          echo "$(rustup run 1.98.1 rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Install qemu and aarch64 binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu
      - name: Self-containment audit
        env:
          QEMU: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'qemu-aarch64' || '' }}
        run: tools/audit.sh target/${{ matrix.target }}/release/vmbench
      - name: Package
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          NAME="vmbench-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/vmbench" "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: vmbench-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            TAG="v${VERSION}-manual-$(date -u +%Y%m%d%H%M%S)"
          fi
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --title "vmbench ${TAG}" \
            --notes "Per-target static binaries built by GitHub Actions. See the repository README.md for usage."
